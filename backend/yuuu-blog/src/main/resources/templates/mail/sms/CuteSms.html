<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background-color: #fff5e6;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .header {
      font-size: 24px;
      font-weight: bold;
      color: #ff6699;
      margin-bottom: 20px;
      text-align: center;
    }
    .content {
      font-size: 16px;
      line-height: 1.6;
      text-align: center;
    }
    .code {
      font-size: 20px;
      font-weight: bold;
      color: #ff6699;
      margin: 20px 0;
    }
    .footer {
      font-size: 14px;
      color: #777;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">邂逅相遇，适我愿兮</div>
  <div class="content">
    <p>【YuuuBlog】验证码:</p>
    <div class="code">${verificationCode}</div>
    <p>10分钟内有效。切勿将验证码提供给他人！</p>
    <p>高山仰止，景行行止，虽不能至，心向往之。</p>
  </div>
  <div class="footer">感谢您使用YuuuBlog，祝您生活愉快！</div>
</div>
</body>
</html>
