<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: 'Georgia', serif;
      background-color: #f9f9f9;
      color: #444;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .header {
      font-size: 24px;
      font-weight: bold;
      color: #8B4513;
      margin-bottom: 20px;
      text-align: center;
    }
    .content {
      font-size: 16px;
      line-height: 1.6;
      text-align: center;
    }
    .footer {
      font-size: 14px;
      color: #777;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">您的内容有了新动态！</div>
  <div class="content">
    <p>亲爱的用户，您的内容【${articleTitle}】有了新的回复/点赞：</p>
    <p>${replyContent}</p>
    <p>点击<a href="${articleLink}">这里</a>查看详情。</p>
    <p>多少事，从来急；天地转，光阴迫。一万年太久，只争朝夕。</p>
  </div>
  <div class="footer">感谢您使用YuuuBlog，祝您生活愉快！</div>
</div>
</body>
</html>
